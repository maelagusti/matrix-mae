/* ---------- Mesures : tout se calcule à partir de la largeur du visuel ---------- */
:root{
  --vh100:100vh;
  --red:#ff3b3b;  --red-rgb:255,59,59;
  --blue:#35b6ff; --blue-rgb:53,182,255;
  --green:#00ff5a;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
@supports (height:100svh){ :root{ --vh100:100svh; } }
:root{
  /* Largeur du visuel 9:16 : il tient TOUJOURS en entier dans l'écran visible */
  --w:min(calc(100vw - var(--safe-l) - var(--safe-r)),
          calc((var(--vh100) - var(--safe-t) - var(--safe-b)) * 9 / 16));
  --u:calc(var(--w) / 1080);          /* 1 "pixel Canva" */
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{
  margin:0; height:100%; background:#000; overflow:hidden;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}

/* ---------- Hiérarchie des couches ----------
   body (noir)
   └ #root  (isolation:isolate = contexte d'empilement propre)
      ├ #matrix        z 0   canvas plein écran
      ├ #root::before  z 1   vignettage transparent au centre
      ├ #home          z 2   visuel WebP (transparent) + boutons au-dessus
      ├ #sync          z 3
      ├ #challenges    z 3   missions
      └ #flash         z 10
*/
#root{
  position:relative; isolation:isolate;
  width:100%; height:100vh; height:var(--vh100); overflow:hidden;
}
#matrix{
  position:absolute; inset:0; width:100%; height:100%;
  z-index:0; display:block; background:#000;
}
#root::before{
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%);
}

.screen{
  position:absolute; inset:0; z-index:2;
  display:grid; place-items:center;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  opacity:0; visibility:hidden;
  transition:opacity .35s ease, visibility 0s linear .35s;
}
.screen.on{ opacity:1; visibility:visible; transition:opacity .35s ease; }

/* ---------- Écran d'accueil ---------- */
#home{ z-index:2; }
.stage{
  position:relative; width:var(--w); aspect-ratio:9/16;
  opacity:0;
}
.visual{
  position:absolute; inset:0; width:100%; height:100%;
  display:block; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; pointer-events:none;
}

/* Zone noire du visuel : de y≈1590 à 1920 (sur 1920). Boutons : y 1650 → 1830. */
.choices{
  position:absolute; z-index:2;
  left:5.2%; width:89.6%;
  top:calc(1590 / 1920 * 100%); height:calc(180 / 1920 * 100%);
  display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u) * 36);
  opacity:0;
}

.pill{
  --c:var(--red); --c-rgb:var(--red-rgb);
  --t:calc(var(--u) * 5);                 /* épaisseur du trait */
  --seg:linear-gradient(var(--c),var(--c));
  --rot:-.7deg;
  position:relative; cursor:pointer; overflow:visible;
  display:flex; align-items:center; justify-content:center;
  margin:0; padding:0 calc(var(--u) * 10); border:0; border-radius:0; background-color:transparent;
  font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:calc(var(--u) * 30); line-height:1.55; text-align:center;
  color:var(--c);
  text-shadow:0 0 calc(var(--u) * 10) rgba(var(--c-rgb),.55);
  transform:rotate(var(--rot));
  filter:drop-shadow(0 0 calc(var(--u) * 10) rgba(var(--c-rgb),.40));
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .08s ease;
  /* cadre brisé : 8 segments, certains décalés ou en retrait */
  background-repeat:no-repeat;
  background-image:var(--seg),var(--seg),var(--seg),var(--seg),var(--seg),var(--seg),var(--seg),var(--seg);
  background-size:
    56% var(--t), 37% var(--t),
    var(--t) 52%, var(--t) 30%,
    38% var(--t), 50% var(--t),
    var(--t) 60%, var(--t) 24%;
  background-position:
    left 0 top 0,                                     left 63% top calc(var(--u) * 7),
    right 0 top 8%,                                   right calc(var(--u) * -7) top 68%,
    left 0 bottom 0,                                  left 46% bottom calc(var(--u) * -4),
    left 0 top 0,                                     left calc(var(--u) * -6) top 74%;
}
.pill--blue{
  --c:var(--blue); --c-rgb:var(--blue-rgb); --rot:.6deg;
  background-size:
    44% var(--t), 48% var(--t),
    var(--t) 40%, var(--t) 44%,
    62% var(--t), 28% var(--t),
    var(--t) 70%, var(--t) 16%;
  background-position:
    left 0 top calc(var(--u) * -4),                   right 0 top 0,
    right 0 top 0,                                    right calc(var(--u) * 6) top 56%,
    left 0 bottom 0,                                  right calc(var(--u) * 14) bottom calc(var(--u) * 6),
    left 0 top 12%,                                   left calc(var(--u) * -7) top 0;
}
.txt{ position:relative; z-index:1; }

/* fond sombre aux coins coupés + balayage lumineux */
.fx{
  position:absolute; inset:calc(var(--t) * .6); overflow:hidden; pointer-events:none;
  background:rgba(0,0,0,.72);
  clip-path:polygon(0 0, 92% 0, 100% 16%, 100% 100%, 8% 100%, 0 80%);
}
.pill--blue .fx{ clip-path:polygon(7% 0, 100% 0, 100% 84%, 93% 100%, 0 100%, 0 14%); }
.fx::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 42%, rgba(var(--c-rgb),.28) 50%, transparent 58%);
  transform:translateX(-110%);
}
/* équerre fantôme décalée (glitch discret) */
.pill::before{
  content:""; position:absolute; pointer-events:none;
  left:calc(var(--u) * -14); top:calc(var(--u) * -14); width:34%; height:46%;
  border-top:calc(var(--u) * 3) solid var(--c); border-left:calc(var(--u) * 3) solid var(--c);
  opacity:.55;
}
.pill--blue::before{
  left:auto; top:auto; right:calc(var(--u) * -14); bottom:calc(var(--u) * -14);
  border:0; border-bottom:calc(var(--u) * 3) solid var(--c); border-right:calc(var(--u) * 3) solid var(--c);
}
/* curseur clignotant */
.cur{
  position:absolute; z-index:1; right:calc(var(--u) * 20); bottom:calc(var(--u) * 20);
  width:calc(var(--u) * 20); height:calc(var(--u) * 20);
  background:var(--c); box-shadow:0 0 calc(var(--u) * 8) var(--c);
}
.pill:hover .fx{ background:rgba(var(--c-rgb),.12); }
.pill:active{ transform:translateY(calc(var(--u) * 5)) rotate(var(--rot)) scale(.965); }
.pill:active .fx{ background:rgba(var(--c-rgb),.28); }
.pill:focus-visible{ outline:calc(var(--u) * 5) solid #fff; outline-offset:calc(var(--u) * 8); }

/* ---------- Animations d'ouverture (une seule séquence) ---------- */
.ready .stage{ opacity:1; animation:boot 1.1s linear backwards; }
.ready .choices{ opacity:1; animation:fadein .6s ease 1.1s backwards; }

/* pulsation + balayage + curseur : démarrent quand les boutons sont apparus */
.ready .pill{ animation:halo 2.6s ease-in-out 1.7s infinite; }
.ready .pill .fx::after{ animation:sweep 3.8s ease-in-out 1.9s infinite; }
.ready .pill::before{ animation:jitter 5.5s steps(1) 3s infinite; }
.ready .cur{ animation:blink 1s steps(1) 1.7s infinite; }
.ready .pill--blue{ animation-delay:3s; }
.ready .pill--blue .fx::after{ animation-delay:3.8s; }
.ready .pill--blue::before{ animation-delay:4.6s; }
.ready .pill--blue .cur{ animation-delay:2.2s; }

@keyframes boot{
  0%  { opacity:0; }
  12% { opacity:.9; transform:translateX(calc(var(--u) * -9)); }
  22% { opacity:.15; transform:none; }
  34% { opacity:1; transform:translateX(calc(var(--u) * 7)); }
  44% { opacity:.55; transform:none; }
  60%,100%{ opacity:1; transform:none; }
}
@keyframes fadein{ from{opacity:0} to{opacity:1} }
@keyframes halo{
  0%,100%{ filter:drop-shadow(0 0 calc(var(--u) * 8) rgba(var(--c-rgb),.30)); }
  50%    { filter:drop-shadow(0 0 calc(var(--u) * 26) rgba(var(--c-rgb),.85)); }
}
@keyframes jitter{
  0%,92%,100%{ transform:none; }
  94%{ transform:translate(calc(var(--u) * 7), calc(var(--u) * -3)); }
  97%{ transform:translate(calc(var(--u) * -5), calc(var(--u) * 2)); }
}
@keyframes sweep{
  0%,55%{ transform:translateX(-110%); }
  100%  { transform:translateX(110%); }
}
@keyframes blink{ 0%{opacity:1} 50%{opacity:0} }

/* ---------- Transition pilule rouge ---------- */
#flash{
  position:absolute; inset:0; z-index:10; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 82%, #ff4a4a 0%, #c00000 60%, #5a0000 100%);
}
#flash.go{ animation:flash .5s ease-out; }
@keyframes flash{ 0%{opacity:0} 22%{opacity:.92} 100%{opacity:0} }

#sync{ z-index:3; background:rgba(0,0,0,.88); }
.sync-box{ display:grid; justify-items:center; gap:calc(var(--u) * 70); }
.spinner{
  width:calc(var(--u) * 150); height:calc(var(--u) * 150); border-radius:50%;
  border:calc(var(--u) * 14) solid rgba(0,255,90,.18);
  border-top-color:var(--green);
  box-shadow:0 0 calc(var(--u) * 30) rgba(0,255,90,.25);
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.sync-text{
  margin:0; font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:calc(var(--u) * 42); color:var(--green); text-align:center;
  text-shadow:0 0 calc(var(--u) * 14) rgba(0,255,90,.6);
}

/* ---------- Page pilule bleue ---------- */
#blue{ z-index:3; background:rgba(0,0,0,.8); }
.blue-text{
  margin:0; width:86%; text-align:center; text-wrap:balance;
  font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:calc(var(--u) * 46); line-height:1.9; color:#fff;
  text-shadow:0 0 calc(var(--u) * 12) rgba(255,255,255,.25);
}
.blue-text .cur{ position:static; display:inline-block; vertical-align:-.1em; margin-left:.35em;
  width:.6em; height:.9em; background:var(--green); box-shadow:0 0 calc(var(--u) * 10) var(--green); }
.circ{ position:relative; display:inline-block; }
.circ::before{ content:"^"; position:absolute; left:0; right:0; top:-.36em; text-align:center; font-size:1em; }
#blue.on .blue-text{ animation:boot 1.1s linear .35s backwards; }
#blue.on .cur{ animation:blink 1s steps(1) 1.2s infinite; }

/* ---------- Bouton discret "Retour au dilemme" (toutes les pages sauf l'accueil) ---------- */
.btn-home{
  position:absolute; z-index:5;
  top:calc(var(--safe-t) + 6px); left:50%; transform:translateX(-50%); white-space:nowrap;
  min-width:44px; min-height:44px; padding:0 max(10px, calc(var(--u) * 24));
  display:flex; align-items:center; justify-content:center; cursor:pointer; border:0; background:transparent;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:max(9px, calc(var(--u) * 22));
  color:rgba(255,255,255,.42);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  opacity:0; visibility:hidden; transition:opacity .35s ease, visibility 0s linear .35s, color .15s ease;
}
#root.away .btn-home{ opacity:1; visibility:visible; transition:opacity .35s ease, color .15s ease; }
.btn-home:hover,.btn-home:active{ color:#fff; }
.btn-home:focus-visible{ outline:2px solid #fff; outline-offset:-4px; }

/* ---------- Écran des missions ---------- */
#challenges{
  --amber:#00ff73; --amber-rgb:0,255,115;   /* couleur d'accent des missions */
  z-index:3; background:rgba(6,6,10,.94);
  display:flex; flex-direction:column; align-items:center;
  overflow-y:auto; overscroll-behavior:contain;
  padding-bottom:calc(var(--safe-b) + var(--kb, 0px));   /* place réservée au clavier */
}
.mission{
  width:calc(var(--w) * .88); margin:auto 0; padding:calc(var(--u) * 60) 0;
  display:grid; gap:calc(var(--u) * 56); justify-items:center; text-align:center;
}
.m-title{
  margin:0; width:100%; min-height:calc(var(--u) * 240);
  display:grid; place-items:center; padding:calc(var(--u) * 30) calc(var(--u) * 10);
  font-family:"Press Start 2P",ui-monospace,monospace; font-weight:400;
  font-size:calc(var(--u) * 42); line-height:1.7; text-wrap:balance;
  color:var(--amber); text-shadow:0 0 calc(var(--u) * 14) rgba(var(--amber-rgb),.45);
  border-top:calc(var(--u) * 4) solid var(--amber); border-bottom:calc(var(--u) * 4) solid var(--amber);
}
.m-title.spin{ color:#fff; text-shadow:none; border-color:rgba(255,255,255,.3); }
.m-title.lock{ animation:lock .5s ease-out; }
@keyframes lock{ 0%{ filter:brightness(2.2); } 100%{ filter:none; } }
.m-body{ width:100%; display:grid; gap:calc(var(--u) * 56); justify-items:center; animation:fadein .5s ease; }
.m-body[hidden]{ display:none; }
.m-text{
  margin:0; font-family:"VT323",ui-monospace,monospace;
  font-size:calc(var(--u) * 74); line-height:1.1; color:#f4f4f4; text-wrap:pretty;
}
.btn-change{
  margin-top:calc(var(--u) * 20); min-height:44px; cursor:pointer;
  padding:max(12px, calc(var(--u) * 26)) max(14px, calc(var(--u) * 36));
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:max(10px, calc(var(--u) * 24));
  color:var(--amber); background:transparent; border:2px solid rgba(var(--amber-rgb),.55); border-radius:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:transform .08s ease;
}
.btn-change:active{ transform:translateY(2px) scale(.97); background:rgba(var(--amber-rgb),.15); }
.btn-change:disabled{ opacity:.3; cursor:default; }
.btn-change:focus-visible{ outline:3px solid #fff; outline-offset:4px; }

/* Contrôle le temps */
.chrono{ width:100%; display:grid; gap:calc(var(--u) * 44); justify-items:center; }
.chrono-time{
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:calc(var(--u) * 118);
  color:#fff; text-shadow:0 0 calc(var(--u) * 20) rgba(255,255,255,.25);
}
.chrono-btn{
  width:100%; min-height:calc(var(--u) * 190); cursor:pointer; border:0; border-radius:0;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:calc(var(--u) * 70);
  color:#031a0c; background:var(--amber); box-shadow:0 calc(var(--u) * 16) 0 #079a4a;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .06s ease, box-shadow .06s ease;
}
.chrono-btn.stop{ color:#fff; background:#ff4a4a; box-shadow:0 calc(var(--u) * 16) 0 #8a1f1f; }
.chrono-btn:active{ transform:translateY(calc(var(--u) * 12)); box-shadow:0 calc(var(--u) * 4) 0 #0006; }
.chrono-btn:focus-visible{ outline:3px solid #fff; outline-offset:4px; }
.chrono-res{
  min-height:1.2em; margin:0; font-family:"VT323",ui-monospace,monospace;
  font-size:calc(var(--u) * 76); color:var(--amber);
}
.chrono-res.perfect{ color:#fff; text-shadow:0 0 calc(var(--u) * 16) rgba(var(--amber-rgb),.8); }

/* Message pour le futur */
.futur{ width:100%; }
.futur textarea{
  display:block; width:100%; min-height:calc(var(--u) * 340); margin:0;
  padding:calc(var(--u) * 30); resize:none; outline:0; border-radius:0; -webkit-appearance:none; appearance:none;
  font-family:"VT323",ui-monospace,monospace; font-size:max(18px, calc(var(--u) * 68)); line-height:1.1; text-align:left;
  color:#fff; caret-color:var(--amber); background:rgba(255,255,255,.05);
  border:calc(var(--u) * 4) solid rgba(var(--amber-rgb),.8);
}
.futur textarea:focus{ border-color:#fff; }
.futur-note{ margin:calc(var(--u) * 24) 0 0; font-family:"VT323",ui-monospace,monospace; font-size:max(15px, calc(var(--u) * 50)); line-height:1.1; color:rgba(255,255,255,.6); text-align:center; }
.futur textarea::placeholder{ color:rgba(255,255,255,.4); }

</style>
</head>

<script>
/* ============ Fond Matrix (canvas 2D, léger) ============ */
(() => {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
  const FPS = 24, STEP = 1000 / FPS;
  let W = 0, H = 0, FS = 16, cols = 0, y = [], v = [], last = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    if (w === W && Math.abs(h - H) < 120) return;   // ignore la barre d'URL mobile
    W = w; H = h; FS = W < 600 ? 16 : 20;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    cols = Math.ceil(W / FS);
    y = Array.from({length: cols}, () => Math.random() * -(H / FS));
    v = Array.from({length: cols}, () => 0.45 + Math.random() * 0.55);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.09)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = FS + 'px monospace';
    ctx.textBaseline = 'top';
    for (let i = 0; i < cols; i++) {
      const row = Math.floor(y[i]);
      if (row >= 0) {
        const ch = CHARS[(Math.random() * CHARS.length) | 0];
        const px = i * FS, py = row * FS;
        ctx.fillStyle = '#00ff5a';             // corps de la colonne
        ctx.fillText(ch, px, py);
        ctx.fillStyle = 'rgba(200,255,215,.9)'; // tête plus claire
        ctx.fillText(ch, px, py);
      }
      y[i] += v[i];
      if (y[i] * FS > H && Math.random() > 0.975) { y[i] = 0; v[i] = 0.45 + Math.random() * 0.55; }
    }
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < STEP) return;
    last = t; draw();
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();

/* ============ Séquence d'ouverture ============ */
(() => {
  const root = document.getElementById('root');
  const img = document.querySelector('.visual');
  let started = false;
  const go = () => { if (!started) { started = true; root.classList.add('ready'); } };
  if (img.complete) { (img.decode ? img.decode() : Promise.resolve()).catch(() => {}).then(go); }
  else { img.addEventListener('load', go); img.addEventListener('error', go); }
  setTimeout(go, 2500);   // filet de sécurité
})();

/* ============ Missions ============ */
const Missions = (() => {
  const $ = id => document.getElementById(id);
  const titleEl = $('m-title'), bodyEl = $('m-body'), textEl = $('m-text'), extraEl = $('m-extra'), btn = $('btn-change');
  const HIDE_CHRONO_WHILE_RUNNING = false;   // true = le chrono se cache pendant qu'il tourne (difficile !)

  // Pour modifier ou ajouter une mission : une ligne ici (extra = modèle <template> à afficher)
  const MISSIONS = [
    { id:'barbichette', title:'JEU DE LA BARBICHETTE',
      text:"Face à l'agent Mae, tenez-vous par la barbichette : le premier qui rigole perd." },
    { id:'pfc', title:'PIERRE-FEUILLE-CISEAUX',
      text:"Affrontez l'agent Mae en 3 manches gagnantes" },
    { id:'temps', title:'CONTRÔLE LE TEMPS',
      text:"Sans regarder le téléphone, arrête le chrono à pile 5,00 secondes", extra:'tpl-chrono' },
    { id:'futur', title:'MESSAGE POUR LE FUTUR',
      text:"Que te souhaites-tu pour 2027 ? Écris-le et fais une capture d'écran pour conserver ton souhait.", extra:'tpl-message' },
    { id:'selfie', title:'SELFIE ANACHRONIQUE',
      text:"Prends une photo depuis ton téléphone avec l'agent Mae" }
  ];

  let current = -1, timer = 0, cleanup = null;
  // la police pixel n'a pas de "Ô" propre : on le compose avec un accent circonflexe
  const pixel = s => '<span>' + s.replace(/Ô/g, '<span class="circ">O</span>') + '</span>';

  function setupChrono(root) {
    const disp = root.querySelector('.chrono-time'), b = root.querySelector('.chrono-btn'), res = root.querySelector('.chrono-res');
    let t0 = 0, raf = 0, running = false;
    const fmt = ms => (Math.floor(ms / 10) / 100).toFixed(2).replace('.', ',');
    const tick = () => { disp.textContent = HIDE_CHRONO_WHILE_RUNNING ? '?,??' : fmt(performance.now() - t0); raf = requestAnimationFrame(tick); };
    function press() {
      if (!running) {
        running = true; res.textContent = ''; res.classList.remove('perfect');
        b.textContent = 'STOP'; b.classList.add('stop'); t0 = performance.now(); tick();
      } else {
        const ms = performance.now() - t0; cancelAnimationFrame(raf); running = false;
        disp.textContent = fmt(ms); b.textContent = 'START'; b.classList.remove('stop');
        const d = Math.floor(ms / 10) - 500;
        if (d === 0) { res.textContent = 'PILE ! BRAVO !'; res.classList.add('perfect'); }
        else res.textContent = 'Écart : ' + (d > 0 ? '+' : '-') + (Math.abs(d) / 100).toFixed(2).replace('.', ',') + ' s';
      }
    }
    b.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
    b.addEventListener('click', e => { if (e.detail === 0) press(); });   // clavier / lecteur d'écran
    return () => cancelAnimationFrame(raf);
  }

  function render(i) {
    const m = MISSIONS[i];
    titleEl.innerHTML = pixel(m.title); titleEl.setAttribute('aria-label', m.title);
    textEl.textContent = m.text;
    extraEl.replaceChildren();
    if (m.extra) {
      extraEl.appendChild($(m.extra).content.cloneNode(true));
      if (m.id === 'temps') cleanup = setupChrono(extraEl);
    }
    bodyEl.hidden = false;
    titleEl.classList.remove('spin'); titleEl.classList.remove('lock'); void titleEl.offsetWidth; titleEl.classList.add('lock');
    btn.disabled = false;
    if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(20);
  }

  // Tire une mission (différente de la précédente) avec une courte "roulette" de titres
  function start(forced) {
    clearTimeout(timer);
    if (cleanup) { cleanup(); cleanup = null; }
    let next = forced;
    if (next == null || next < 0) {
      do { next = Math.floor(Math.random() * MISSIONS.length); } while (next === current && MISSIONS.length > 1);
    }
    current = next; bodyEl.hidden = true; btn.disabled = true;

    const n = MISSIONS.length, steps = 12, seq = [];
    seq[steps - 1] = next;
    for (let k = steps - 2; k >= 0; k--) seq[k] = (seq[k + 1] - 1 + n) % n;   // défile dans l'ordre, finit sur la mission tirée
    titleEl.classList.remove('lock'); titleEl.classList.add('spin');
    let i = 0;
    (function tick() {
      titleEl.innerHTML = pixel(MISSIONS[seq[i]].title);
      i++;
      timer = setTimeout(i < steps ? tick : () => render(next), i < steps ? 55 + i * i * 1.4 : 250);
    })();
  }

  function stop() { clearTimeout(timer); if (cleanup) { cleanup(); cleanup = null; } }
  btn.addEventListener('click', () => start());
  return { start, stop, indexOf: id => MISSIONS.findIndex(m => m.id === id) };
})();

/* ============ Clavier : il recouvre la page, la mise en page ne rétrécit pas ============ */
(() => {
  const root = document.getElementById('root');
  const ch = document.getElementById('challenges');
  const docEl = document.documentElement;
  const vv = window.visualViewport;
  let stableH = 0, frozen = false, ta = null;

  const measure = () => { if (!frozen) stableH = root.getBoundingClientRect().height; };
  window.addEventListener('resize', measure);
  window.addEventListener('orientationchange', () => setTimeout(measure, 300));
  measure();

  // met le champ de texte au-dessus du clavier
  function adjust() {
    if (!frozen || !vv) return;
    const kb = Math.max(0, Math.round(stableH - vv.height));
    ch.style.setProperty('--kb', (kb > 100 ? kb : 0) + 'px');
    requestAnimationFrame(() => {
      if (!ta) return;
      const bottom = vv.offsetTop + vv.height - 16;
      const r = ta.getBoundingClientRect();
      if (r.bottom > bottom) ch.scrollTop += r.bottom - bottom;
    });
  }

  document.addEventListener('focusin', e => {
    if (e.target.tagName !== 'TEXTAREA') return;
    ta = e.target;
    if (!frozen) {
      if (!stableH) measure();
      docEl.style.setProperty('--vh100', stableH + 'px');   // fige la hauteur : plus de rétrécissement
      frozen = true;
      if (vv) { vv.addEventListener('resize', adjust); vv.addEventListener('scroll', adjust); }
    }
    adjust(); setTimeout(adjust, 150); setTimeout(adjust, 450);
  });

  document.addEventListener('focusout', e => {
    if (e.target !== ta) return;
    frozen = false; ta = null;
    if (vv) { vv.removeEventListener('resize', adjust); vv.removeEventListener('scroll', adjust); }
    docEl.style.removeProperty('--vh100');
    ch.style.setProperty('--kb', '0px');
    setTimeout(() => { window.scrollTo(0, 0); measure(); }, 100);
  });
})();

/* ============ Choix des pilules et navigation ============ */
(() => {
  const root = document.getElementById('root');
  const home = document.getElementById('home');
  const sync = document.getElementById('sync');
  const blue = document.getElementById('blue');
  const challenges = document.getElementById('challenges');
  const flash = document.getElementById('flash');
  let busy = false;
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  const show = (el, on) => { el.classList.toggle('on', on); el.setAttribute('aria-hidden', String(!on)); };
  const away = on => root.classList.toggle('away', on);
  const buzz = ms => { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(ms); };

  // Pilule bleue : fondu vers la page "Vous restez enfermé dans la matrice..."
  document.getElementById('btn-blue').addEventListener('click', () => {
    if (busy) return; busy = true;
    away(true); show(home, false);
    later(() => show(blue, true), 400);
  });

  // Pilule rouge : flash -> synchronisation -> tirage d'une mission
  document.getElementById('btn-red').addEventListener('click', () => {
    if (busy) return; busy = true;
    buzz(30);
    away(true);
    flash.classList.add('go');
    later(() => show(home, false), 160);
    later(() => show(sync, true), 450);
    later(() => { show(sync, false); show(challenges, true); }, 450 + 1100);
    later(() => Missions.start(), 450 + 1100 + 400);
  });

  // Bouton discret : retour à l'accueil depuis n'importe quelle page
  document.getElementById('btn-home').addEventListener('click', () => {
    timers.forEach(clearTimeout); timers.length = 0;
    Missions.stop();
    flash.classList.remove('go');
    [sync, blue, challenges].forEach(el => show(el, false));
    show(home, true); away(false);
    busy = false;
  });

  // Aperçu direct d'une mission : index.html#barbichette | #pfc | #temps | #futur | #selfie
  const forced = Missions.indexOf(location.hash.slice(1));
  if (forced >= 0) {
    busy = true; away(true); show(home, false); show(challenges, true); Missions.start(forced);
  }
})();
</script>
